name: Flutter CI

# Menjalankan flutter analyze, flutter test, dan membuat APK debug di server GitHub,
# supaya tidak bergantung pada laptop yang memblokir dart.exe / impellerc.exe.
on:
  push:
    branches: [main, master, feature/logbook-dashboard]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # build.gradle.kts memakai JavaVersion.VERSION_18

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: flutter analyze
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyze.txt

      - name: flutter test
        continue-on-error: true
        run: flutter test 2>&1 | tee test.txt

      - name: Build APK debug
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: wanur-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-and-test-logs
          path: |
            analyze.txt
            test.txt
